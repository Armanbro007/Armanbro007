<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Experience and education</title>
  <desc id="d">Work: Poolz Finance, Marketing Content Creator, June 2021 to January 2026, 150+ banners and 75+ promo videos. Mind AI, Freelance Editor, October 2024 to March 2025. Node Monster, Graphic Designer, December 2025 to April 2026. Education: Diploma in Computer Technology, Chattogram Polytechnic Institute, 2018 to 2023. BSc in Computer Science and Engineering, East Delta University, 2023 to now.</desc>
  <style>
    :root { --bg:#f6f8fa; --line:#d0d7de; --grid:#e6e9ed; --text:#1f2328; --muted:#59636e; --accent:#0e7c66; --accent2:#6639ba; --accent3:#b35900; --edu:#0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --line:#30363d; --grid:#21262d; --text:#e6edf3; --muted:#9198a1; --accent:#3fb9a0; --accent2:#a371f7; --accent3:#f0883e; --edu:#4493f8; }
    }
    .bg { fill:var(--bg); stroke:var(--line); }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .eyebrow { fill:var(--accent); font-size:14px; letter-spacing:3px; font-weight:600; }
    .grp { fill:var(--muted); font-size:12px; letter-spacing:2.5px; font-weight:600; }
    .org { fill:var(--text); font-size:15px; font-weight:600; }
    .role { fill:var(--muted); font-size:12.5px; }
    .yr { fill:var(--muted); font-size:12px; }
    .grid { stroke:var(--grid); stroke-width:1; }
    .note { fill:var(--text); font-size:12.5px; font-weight:600; }
    .w1 { fill:var(--accent); } .w2 { fill:var(--accent2); } .w3 { fill:var(--accent3); } .e1,.e2 { fill:var(--edu); }
    .grow { transform-box:fill-box; transform-origin:left center; animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .now { fill:var(--edu); transform-box:fill-box; transform-origin:center; animation:pulse 1.8s ease-in-out infinite; }
    @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    @media (prefers-reduced-motion: reduce) { .grow,.now { animation:none; } }
  </style>
