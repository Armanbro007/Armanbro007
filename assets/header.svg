<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Arman Rahman</title>
  <desc id="d">I turn AI ideas into tools people actually use. CSE at East Delta University, with 4+ years of remote work for Web3 teams.</desc>
  <style>
    :root { --bg:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e; --accent:#0e7c66; --accent2:#6639ba; --node:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --line:#30363d; --text:#e6edf3; --muted:#9198a1; --accent:#3fb9a0; --accent2:#a371f7; --node:#161b22; }
    }
    .bg { fill:var(--bg); stroke:var(--line); }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .eyebrow { fill:var(--accent); font-size:15px; letter-spacing:3px; font-weight:600; }
    .name { fill:var(--text); font-size:60px; font-weight:700; letter-spacing:-1.5px; }
    .tag { fill:var(--text); font-size:25px; }
    .tag tspan.hl { fill:var(--accent); font-weight:600; }
    .meta { fill:var(--muted); font-size:16px; }
    .edge { stroke:var(--line); stroke-width:1.5; }
    .pulse { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:14 400; stroke-dashoffset:414; animation:flow 3.6s linear infinite; }
    .pulse.b { stroke:var(--accent2); animation-delay:1.2s; }
    .pulse.c { animation-delay:2.4s; }
    .n { fill:var(--node); stroke:var(--muted); stroke-width:1.5; }
    .n.on { stroke:var(--accent); animation:glow 3.6s ease-in-out infinite; }
    .out { fill:var(--accent); }
    .lbl { fill:var(--muted); font-size:12px; }
    .lbl.ok { fill:var(--accent); font-weight:600; }
    .cursor { fill:var(--accent); animation:blink 1.1s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset:0; } }
    @keyframes glow { 0%,100% { stroke-width:1.5; } 50% { stroke-width:4; } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .pulse,.n.on,.cursor { animation:none; } .pulse { stroke-dasharray:none; opacity:.35; } }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="1279" height="339" rx="14"/>

  <!-- left: identity -->
  <text class="sans eyebrow" x="64" y="92">AI · WEB · DESIGN · CHATTOGRAM, BANGLADESH</text>
  <text class="sans name" x="62" y="160">Arman Rahman</text>
  <text class="sans tag" x="64" y="210">I turn AI ideas into <tspan class="hl">tools people actually use</tspan>.</text>
  <text class="mono meta" x="64" y="262">$ ls projects/  bloodmate  prescription-digitizer  khela-calendar  defakenet-lite<tspan class="cursor" dx="6">▍</tspan></text>
  <text class="sans meta" x="64" y="296">CSE at East Delta University · 4+ years of remote work for Web3 teams</text>

  <!-- right: a tiny network that "classifies" a face as real/fake -->
  <g transform="translate(830,58)">
    <g class="edges">
      <line class="edge" x1="20" y1="30"  x2="150" y2="10"/><line class="edge" x1="20" y1="30"  x2="150" y2="80"/><line class="edge" x1="20" y1="30"  x2="150" y2="150"/>
      <line class="edge" x1="20" y1="110" x2="150" y2="10"/><line class="edge" x1="20" y1="110" x2="150" y2="80"/><line class="edge" x1="20" y1="110" x2="150" y2="150"/><line class="edge" x1="20" y1="110" x2="150" y2="220"/>
      <line class="edge" x1="20" y1="190" x2="150" y2="80"/><line class="edge" x1="20" y1="190" x2="150" y2="150"/><line class="edge" x1="20" y1="190" x2="150" y2="220"/>
      <line class="edge" x1="150" y1="10"  x2="280" y2="60"/><line class="edge" x1="150" y1="80"  x2="280" y2="60"/><line class="edge" x1="150" y1="150" x2="280" y2="60"/>
      <line class="edge" x1="150" y1="80"  x2="280" y2="160"/><line class="edge" x1="150" y1="150" x2="280" y2="160"/><line class="edge" x1="150" y1="220" x2="280" y2="160"/>
      <line class="edge" x1="280" y1="60"  x2="370" y2="110"/><line class="edge" x1="280" y1="160" x2="370" y2="110"/>
    </g>
    <path class="pulse"   d="M20 30 L150 80 L280 60 L370 110"/>
    <path class="pulse b" d="M20 110 L150 150 L280 160 L370 110"/>
    <path class="pulse c" d="M20 190 L150 220 L280 160 L370 110"/>
    <circle class="n on" cx="20" cy="30" r="9"/><circle class="n" cx="20" cy="110" r="9"/><circle class="n" cx="20" cy="190" r="9"/>
    <circle class="n" cx="150" cy="10" r="9"/><circle class="n on" cx="150" cy="80" r="9"/><circle class="n" cx="150" cy="150" r="9"/><circle class="n" cx="150" cy="220" r="9"/>
    <circle class="n on" cx="280" cy="60" r="9"/><circle class="n" cx="280" cy="160" r="9"/>
    <circle class="out" cx="370" cy="110" r="13"/>
    <text class="mono lbl" x="-2" y="252">idea</text>
    <text class="mono lbl ok" x="370" y="150" text-anchor="middle">SHIPPED</text>
  </g>
</svg>
