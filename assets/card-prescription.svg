<svg xmlns="http://www.w3.org/2000/svg" width="410" height="250" viewBox="0 0 410 250" role="img" aria-labelledby="t d">
  <title id="t">Prescription Digitizer</title>
  <desc id="d">Reads handwritten medicine names on Bangladeshi prescriptions, and flags unsure results for a human to check. CRNN + CTC with a Gemini fallback</desc>
  <style>
    :root { --bg:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e; --accent:#0e7c66; --accent2:#6639ba; --chip:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --line:#30363d; --text:#e6edf3; --muted:#9198a1; --accent:#3fb9a0; --accent2:#a371f7; --chip:#161b22; }
    }
    .bg { fill:var(--bg); stroke:var(--line); }
    .bar { fill:var(--accent2); }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .kicker { fill:var(--accent2); font-size:12px; letter-spacing:2px; font-weight:600; }
    .title { fill:var(--text); font-size:24px; font-weight:700; }
    .body { fill:var(--muted); font-size:15px; }
    .stat { fill:var(--accent2); font-size:15px; font-weight:600; }
    .chip { fill:var(--chip); stroke:var(--line); }
    .chiptxt { fill:var(--muted); font-size:12px; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="409" height="249" rx="12"/>
  <rect class="bar" x="0.5" y="0.5" width="6" height="249" rx="3"/>
  <text class="sans kicker" x="28" y="40">HEALTH · DOCUMENT AI</text>
  <text class="sans title" x="28" y="74">Prescription Digitizer</text>
  <text class="sans body" x="28" y="106">Reads handwritten medicine names on</text>
  <text class="sans body" x="28" y="128">Bangladeshi prescriptions, and flags</text>
  <text class="sans body" x="28" y="150">unsure results for a human to check.</text>
  <text class="sans stat" x="28" y="180">CRNN + CTC with a Gemini fallback</text>
  <rect class="chip" x="28" y="204" width="63" height="26" rx="13"/><text class="mono chiptxt" x="38" y="221">Python</text>
  <rect class="chip" x="99" y="204" width="56" height="26" rx="13"/><text class="mono chiptxt" x="109" y="221">Keras</text>
  <rect class="chip" x="163" y="204" width="63" height="26" rx="13"/><text class="mono chiptxt" x="173" y="221">Gemini</text>
  <rect class="chip" x="234" y="204" width="85" height="26" rx="13"/><text class="mono chiptxt" x="244" y="221">Streamlit</text>
</svg>
